[project]
name = "good-service-backend"
version = "1.0.0"
description = "好服务平台后端API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-CORS>=4.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.2",
    "marshmallow>=3.20.1",
    "Pillow>=10.1.0",
    "captcha>=0.5.0",
    "python-dotenv>=1.0.0",
    "Werkzeug>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
prod = [
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
